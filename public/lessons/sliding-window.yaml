lessontitle: "Best Time to Buy and Sell Stock"
metadata:
  difficulty: 1

content:
  - type: markdown
    text: |
      # Best Time to Buy and Sell Stock

      You are given an array `prices` where `prices[i]` is the price of a given stock on the $i^{\text{th}}$ day.

      You want to maximize your profit by choosing a **single day** to buy one stock and choosing a **different day in the future** to sell that stock.

      Return *the maximum profit you can achieve from this transaction*. If you cannot achieve any profit, return `0`.

      ### Examples
      - **Input:** `prices = [7, 1, 5, 3, 6, 4]`
        **Output:** `5` (Buy on day 2 (price = 1) and sell on day 5 (price = 6), profit = 6 - 1 = 5)
      - **Input:** `prices = [7, 6, 4, 3, 1]`
        **Output:** `0` (In this case, no transactions are done and max profit = 0)

  - type: codeblock
    language: python
    boilerplate:
      - function:
          name: max_profit
          expects: int
          inputs: |
            prices = list[int]

    python: |
      def max_profit(prices: list[int]) -> int:
          # Write your solution here
          pass

  - type: tests
    test_cases:
      - input: [[7, 1, 5, 3, 6, 4]]
        expected: 5
      - input: [[7, 6, 4, 3, 1]]
        expected: 0
      - input: [[2, 4, 1]]
        expected: 2

  - type: hint
    text: |
      Keep track of the minimum price seen so far as you iterate through the array, and at each day calculate the potential profit if you were to sell on that day. Update the max profit accordingly.

