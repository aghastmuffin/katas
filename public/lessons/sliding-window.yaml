  - type: markdown
    text: |
      # Longest Substring Without Repeating Characters

      Given a string `s`, find the length of the **longest substring** without repeating characters.

      A **substring** is a contiguous non-empty sequence of characters within a string.

      ### Examples
      - **Input:** `s = "abcabcbb"`
        **Output:** `3` (The answer is "abc", with the length of 3)
      - **Input:** `s = "bbbbb"`
        **Output:** `1` (The answer is "b", with the length of 1)
      - **Input:** `s = "pwwkew"`
        **Output:** `3` (The answer is "wke", with the length of 3)

  - type: codeblock
    language: python
    boilerplate:
      - function:
          name: length_of_longest_substring
          expects: int
          inputs: |
            s = str

    python: |
      def length_of_longest_substring(s: str) -> int:
          # Write your solution here
          pass

  - type: tests
    test_cases:
      - input: ["abcabcbb"]
        expected: 3
      - input: ["bbbbb"]
        expected: 1
      - input: ["pwwkew"]
        expected: 3
      - input: [""]
        expected: 0

  - type: hint
    text: |
      Use a sliding window technique with two pointers (`left` and `right`) and a Set/Hash Map to track unique characters in the current window. Expand the window by moving `right`, and if a duplicate is found, shrink the window from the `left` until all characters are unique.
