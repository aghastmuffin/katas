          pass

  - type: tests
    test_cases:
      - input: ["()"]
        expected: true
      - input: ["()[]{}"]
        expected: true
      - input: ["(]"]
        expected: false
      - input: ["([)]"]
        expected: false
      - input: ["{[]}"]
        expected: true

  - type: hint
    text: |
      Use a stack to keep track of the opening brackets. When you encounter a closing bracket, check if it matches the top bracket of the stack. If it does, pop it off. If it doesn't match or the stack is empty, then the string is invalid. At the end, the stack should be empty.
